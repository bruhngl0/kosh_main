<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kōsh — Recipe Card Database · Cycle 01</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F0D0A; --surface:#181511; --surface2:#201C17; --surface3:#2A2520;
  --border:#3A3428; --border2:#4A4438;
  --parchment:#F5F2ED; --cream:#EDE8DF; --muted:#8C8070; --stone:#6A6058;
  --copper:#8B5E3C; --copper-lt:#C4895A; --copper-dim:#5A3C24;
  --gold:#C9A84C; --gold-dim:#7A6428;
  --gr:#2A7A4A; --re:#8B2A2A; --amber:#A07010;
  --ff-d:'Cormorant Garamond',Georgia,serif;
  --ff-s:'DM Sans',sans-serif;
  --ff-m:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--cream);font-family:var(--ff-s);font-size:13px;line-height:1.6;min-height:100vh}

/* ── HEADER ── */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-family:var(--ff-d);font-size:20px;font-weight:600;color:var(--parchment);letter-spacing:.04em}
.logo sup{font-size:10px;vertical-align:super;font-style:italic;color:var(--copper-lt)}
.header-meta{font-size:11px;color:var(--stone);font-family:var(--ff-m)}
.header-actions{display:flex;gap:8px}
.btn{padding:6px 14px;border-radius:4px;font-size:11px;font-weight:500;cursor:pointer;border:none;transition:all .15s;letter-spacing:.05em;text-transform:uppercase;font-family:var(--ff-m)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border2)}
.btn-ghost:hover{border-color:var(--copper);color:var(--copper-lt)}
.btn-copper{background:var(--copper-dim);color:var(--copper-lt);border:1px solid var(--copper-dim)}
.btn-copper:hover{background:var(--copper);color:var(--parchment)}

/* ── LAYOUT ── */
.wrap{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 57px)}

/* ── SIDEBAR ── */
.sidebar{background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;height:calc(100vh - 57px);position:sticky;top:57px}
.sidebar-search{padding:14px 16px;border-bottom:1px solid var(--border)}
.search-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:4px;padding:7px 11px;font-family:var(--ff-m);font-size:11px;color:var(--cream);outline:none;transition:border .15s}
.search-input::placeholder{color:var(--stone)}
.search-input:focus{border-color:var(--copper)}
.filter-row{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.filter-pill{padding:3px 9px;border-radius:12px;font-size:10px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--stone);transition:all .15s;font-family:var(--ff-m);letter-spacing:.04em;text-transform:uppercase}
.filter-pill.active{border-color:var(--copper);background:var(--copper-dim);color:var(--copper-lt)}
.day-group{border-bottom:1px solid var(--border)}
.day-group-header{padding:10px 16px 6px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background .15s}
.day-group-header:hover{background:var(--surface2)}
.day-num{font-family:var(--ff-d);font-size:13px;font-style:italic;color:var(--stone)}
.week-badge{font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:8px}
.w1{background:rgba(139,94,60,.2);color:var(--copper-lt)}
.w2{background:rgba(42,122,74,.2);color:#5aaa7a}
.w3{background:rgba(26,59,107,.2);color:#7aaae0}
.w4{background:rgba(201,168,76,.2);color:var(--gold)}
.meal-list{padding:0 0 8px}
.meal-item{display:flex;align-items:center;gap:8px;padding:6px 16px 6px 28px;cursor:pointer;transition:background .15s}
.meal-item:hover{background:var(--surface2)}
.meal-item.active{background:var(--surface3);border-left:2px solid var(--copper)}
.meal-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.meal-name-sidebar{font-size:11px;color:var(--muted);line-height:1.3;flex:1}
.meal-item.active .meal-name-sidebar{color:var(--cream)}
.meal-type-tag{font-size:9px;font-family:var(--ff-m);color:var(--stone);text-transform:uppercase;letter-spacing:.06em;flex-shrink:0}

/* Meal type colors */
.dot-bf{background:#5aaa7a}
.dot-sn{background:var(--copper-lt)}
.dot-lu{background:#7aaae0}
.dot-di{background:var(--gold)}

/* ── MAIN CONTENT ── */
.main{padding:0;overflow-y:auto}
.recipe-card{display:none;padding:32px 40px;min-height:calc(100vh - 57px)}
.recipe-card.visible{display:block}

/* Recipe header */
.rc-header{margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.rc-meta-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rc-day-badge{font-family:var(--ff-m);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--stone)}
.rc-meal-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-family:var(--ff-m)}
.badge-bf{background:rgba(90,170,122,.15);color:#5aaa7a;border:1px solid rgba(90,170,122,.3)}
.badge-sn{background:rgba(196,137,90,.15);color:var(--copper-lt);border:1px solid rgba(196,137,90,.3)}
.badge-lu{background:rgba(122,170,224,.15);color:#7aaae0;border:1px solid rgba(122,170,224,.3)}
.badge-di{background:rgba(201,168,76,.15);color:var(--gold);border:1px solid rgba(201,168,76,.3)}
.rc-title{font-family:var(--ff-d);font-size:clamp(26px,3vw,38px);font-weight:400;color:var(--parchment);line-height:1.1;margin-bottom:8px}
.rc-subtitle{font-size:13px;color:var(--muted);font-style:italic;font-family:var(--ff-d)}

/* Quick stats strip */
.rc-stats{display:flex;gap:0;border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:24px}
.rc-stat{flex:1;padding:12px 16px;border-right:1px solid var(--border);text-align:center}
.rc-stat:last-child{border-right:none}
.rc-stat-val{font-family:var(--ff-d);font-size:22px;font-weight:600;color:var(--copper-lt);line-height:1}
.rc-stat-label{font-size:9px;font-family:var(--ff-m);letter-spacing:.1em;text-transform:uppercase;color:var(--stone);margin-top:4px}

/* Two-col layout inside recipe */
.rc-body{display:grid;grid-template-columns:300px 1fr;gap:28px}

/* Ingredients panel */
.ingredients-panel{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:18px;height:fit-content}
.panel-title{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);font-family:var(--ff-m);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.ingredient-row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--border);gap:12px}
.ingredient-row:last-child{border-bottom:none}
.ing-name{font-size:12px;color:var(--cream)}
.ing-qty{font-family:var(--ff-m);font-size:11px;color:var(--copper-lt);white-space:nowrap}
.ing-note{font-size:10px;color:var(--stone);font-style:italic;width:100%;padding-top:2px}

/* Method panel */
.method-panel{}
.method-step{display:flex;gap:14px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.method-step:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.step-num{font-family:var(--ff-d);font-size:22px;font-weight:400;color:var(--copper-dim);line-height:1;flex-shrink:0;width:28px;padding-top:2px}
.step-body{}
.step-title{font-size:12px;font-weight:500;color:var(--parchment);margin-bottom:3px;letter-spacing:.02em}
.step-text{font-size:12px;color:var(--muted);line-height:1.65}
.step-crit{display:inline-flex;align-items:center;gap:4px;margin-top:5px;padding:3px 8px;border-radius:3px;font-size:10px;font-family:var(--ff-m);letter-spacing:.06em}
.crit-temp{background:rgba(139,42,42,.2);color:#e07070;border:1px solid rgba(139,42,42,.3)}
.crit-time{background:rgba(160,112,16,.2);color:#d4a040;border:1px solid rgba(160,112,16,.3)}
.crit-warn{background:rgba(139,94,60,.2);color:var(--copper-lt);border:1px solid rgba(139,94,60,.3)}

/* Allergen, advance prep, plating row */
.rc-footer{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
.footer-block{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:14px 16px}
.fb-title{font-size:9px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);font-family:var(--ff-m);margin-bottom:10px}
.allergen-flags{display:flex;flex-wrap:wrap;gap:5px}
.allergen{padding:2px 8px;border-radius:3px;font-size:10px;font-weight:500;font-family:var(--ff-m);background:rgba(139,42,42,.2);color:#e07070;border:1px solid rgba(139,42,42,.25)}
.allergen.none{background:rgba(42,122,74,.15);color:#5aaa7a;border-color:rgba(42,122,74,.3)}
.adv-item{display:flex;align-items:flex-start;gap:7px;font-size:11px;color:var(--muted);margin-bottom:5px;line-height:1.5}
.adv-dot{width:5px;height:5px;border-radius:50%;background:var(--copper-lt);flex-shrink:0;margin-top:5px}
.plating-text{font-size:11px;color:var(--muted);line-height:1.7;font-style:italic;font-family:var(--ff-d)}

/* Empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:calc(100vh - 57px);color:var(--stone)}
.empty-icon{font-family:var(--ff-d);font-size:64px;font-style:italic;color:var(--border2);margin-bottom:16px}
.empty-text{font-size:13px;font-family:var(--ff-m);letter-spacing:.08em}

/* Print mode */
@media print{
  .sidebar,.header-actions{display:none}
  .wrap{grid-template-columns:1fr}
  .recipe-card{padding:16px;display:block!important}
  body{background:white;color:black}
}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr}
  .sidebar{display:none}
  .rc-body{grid-template-columns:1fr}
  .rc-footer{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;align-items:center;gap:16px">
    <div class="logo">Kō<sup>sh</sup></div>
    <div style="width:1px;height:24px;background:var(--border)"></div>
    <div class="header-meta">Recipe Card Database · Cycle 01 · 28 Days · 112 Dishes</div>
  </div>
  <div class="header-actions">
    <button class="btn btn-ghost" onclick="window.print()">Print Card</button>
    <button class="btn btn-ghost" id="prev-btn" onclick="navigate(-1)">← Prev</button>
    <button class="btn btn-ghost" id="next-btn" onclick="navigate(1)">Next →</button>
    <button class="btn btn-copper" onclick="showRandom()">Random Recipe</button>
  </div>
</div>

<div class="wrap">
  <div class="sidebar">
    <div class="sidebar-search">
      <input class="search-input" id="search" placeholder="Search recipes…" oninput="filterSidebar()"/>
    </div>
    <div class="filter-row">
      <div class="filter-pill active" onclick="setFilter('all',this)">All</div>
      <div class="filter-pill" onclick="setFilter('bf',this)">Breakfast</div>
      <div class="filter-pill" onclick="setFilter('sn',this)">Snack</div>
      <div class="filter-pill" onclick="setFilter('lu',this)">Lunch</div>
      <div class="filter-pill" onclick="setFilter('di',this)">Dinner</div>
    </div>
    <div id="sidebar-list"></div>
  </div>

  <div class="main" id="main">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">01</div>
      <div class="empty-text">Select a recipe from the sidebar</div>
    </div>
    <div id="cards-container"></div>
  </div>
</div>

<script>
// ── RECIPE DATA ────────────────────────────────────────────────────────────────
// Structure: {id, day, week, meal (bf/sn/lu/di), title, subtitle, kcal, prot, carbs, fat,
//  ingredients:[{name,qty,note}], steps:[{title,text,crits:[{type,text}]}],
//  allergens:[], advance:[], plating:''}

const RECIPES = [
// ═══════════ DAY 1 ═══════════
{id:'d1bf',day:1,week:1,meal:'bf',
title:'Masala Egg White Bhurji',subtitle:'Ragi sourdough toast · green chutney',
kcal:390,prot:34,carbs:28,fat:11,
ingredients:[
  {name:'Egg whites',qty:'8 (from 4 eggs)',note:'Save yolks for Day 28 hollandaise'},
  {name:'Shallots',qty:'60g',note:'Fine dice'},
  {name:'Green chilli',qty:'1 small',note:'Deseeded, minced'},
  {name:'Tomato',qty:'80g',note:'Concasse, no skin/seeds'},
  {name:'Fresh coriander',qty:'10g',note:'Rough chop, add last'},
  {name:'Turmeric',qty:'¼ tsp'},
  {name:'Cumin seeds',qty:'½ tsp'},
  {name:'Cold-press coconut oil',qty:'4g'},
  {name:'Ragi sourdough',qty:'1 slice (45g)'},
  {name:'Green chutney',qty:'25g',note:'Coriander-mint, pre-made'},
],
steps:[
  {title:'Season whites',text:'Whisk whites lightly — do not over-aerate. Season with turmeric, salt, white pepper. Rest 2 min.',crits:[]},
  {title:'Build base',text:'Cold pan, coconut oil, medium heat. Bloom cumin 20 sec. Add shallots — sweat 3 min until soft. Add chilli, tomato — cook 90 sec to remove moisture.',crits:[]},
  {title:'Cook bhurji',text:'Pour whites over base. Fold continuously with silicone spatula on medium-low. Pull off heat when 80% set — residual heat finishes.',crits:[{type:'warn',text:'Never scramble hard — silky and just-set only'}]},
  {title:'Finish',text:'Fold in coriander off heat. Taste salt. Toast ragi, serve immediately — bhurji waits for no one.',crits:[]},
],
allergens:['Egg','Gluten'],advance:[],
plating:'Ragi toast diagonal on plate. Bhurji tumbled to one side, not spread. Chutney in small vessel alongside. Three coriander leaves. No garnish theatre.'},

{id:'d1sn',day:1,week:1,meal:'sn',
title:'Roasted Makhana & Pumpkin Seed Mix',subtitle:'Ghee-roasted · sendha namak',
kcal:185,prot:8,carbs:16,fat:10,
ingredients:[
  {name:'Fox nuts (makhana)',qty:'35g'},

  {name:'Ghee',qty:'4g'},

],
allergens:[],advance:[],
plating:'Small steel snack pot. Makhana mix filled. Date placed on top whole. Sealed.'},

{id:'d1lu',day:1,week:1,meal:'lu',
title:'Chettinad Chicken Thigh',subtitle:'Steamed brown rice · cucumber raita · amaranth greens',
kcal:565,prot:48,carbs:50,fat:16,
ingredients:[
  {name:'Chicken thigh (boneless)',qty:'150g',note:'Trimmed, scored twice'},
  {name:'Brown rice (cooked)',qty:'120g'},
  {name:'Yoghurt (full fat)',qty:'60g',note:'For raita'},
  {name:'Cucumber',qty:'40g',note:'Fine dice for raita'},

  {name:'Curry leaf',qty:'6 leaves'},
],
steps:[

  {title:'Sear',text:'Cast iron, high heat, coconut oil. Sear thigh skin-side down 4 min. Do not move. Flip, 3 min.',crits:[{type:'temp',text:'Internal: 74°C minimum'}]},
  {title:'Rest',text:'Rest 4 min before slicing. While resting, wilt amaranth greens 60 sec in same pan with curry leaf.',crits:[]},
  {title:'Raita',text:'Fold cucumber into yoghurt, cumin powder, salt. Make fresh — do not pre-make.',crits:[]},

steps:[

],
allergens:['Fish','Mustard'],advance:['Cook lentil batch Mon AM — keeps 4 days'],

{id:'d2bf',day:2,week:1,meal:'bf',
title:'Overnight Oats with Whey',subtitle:'Blueberries · toasted almonds · chia',
kcal:410,prot:36,carbs:42,fat:11,
ingredients:[
  {name:'Rolled oats',qty:'60g',note:'Not instant'},

// ── UI STATE ─────────────────────────────────────────────────────────────────
let activeFilter = 'all';
let activeRecipeId = null;
const MEAL_LABELS = {bf:'Breakfast',sn:'Snack',lu:'Lunch',di:'Dinner'};
const WEEK_LABELS = {1:'Week 1 — Establish',2:'Week 2 — Expand',3:'Week 3 — Refine',4:'Week 4 — Peak'};

function buildSidebar(){
  const search = document.getElementById('search').value.toLowerCase();
  const list = document.getElementById('sidebar-list');
  const days = [...new Set(RECIPES.map(r=>r.day))].sort((a,b)=>a-b);
  let html = '';
  days.forEach(day=>{
    const recipes = RECIPES.filter(r=>{
      if(r.day!==day) return false;
      if(activeFilter!=='all' && r.meal!==activeFilter) return false;
      if(search && !r.title.toLowerCase().includes(search) && !r.subtitle.toLowerCase().includes(search)) return false;
      return true;
    });
    if(!recipes.length) return;
    const week = recipes[0].week;
    html += `<div class="day-group">
      <div class="day-group-header" onclick="toggleDay(${day})">
        <span class="day-num">Day ${String(day).padStart(2,'0')}</span>
        <span class="week-badge w${week}">${WEEK_LABELS[week].split('—')[0].trim()}</span>
      </div>
      <div class="meal-list" id="day-${day}">
        ${recipes.map(r=>`
          <div class="meal-item ${r.id===activeRecipeId?'active':''}" onclick="showRecipe('${r.id}')">
            <div class="meal-dot dot-${r.meal}"></div>
            <div class="meal-name-sidebar">${r.title}</div>
            <span class="meal-type-tag">${r.meal}</span>
          </div>`).join('')}
      </div>
    </div>`;
  });
  list.innerHTML = html || '<div style="padding:20px;color:var(--stone);font-size:12px;text-align:center">No recipes match</div>';
}

function toggleDay(day){
  const el = document.getElementById('day-'+day);
  if(el) el.style.display = el.style.display==='none'?'block':'none';
}

function setFilter(f, el){
  activeFilter = f;
  document.querySelectorAll('.filter-pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  buildSidebar();
}

function filterSidebar(){ buildSidebar(); }

function showRecipe(id){
  activeRecipeId = id;
  const r = RECIPES.find(x=>x.id===id);
  if(!r) return;
  document.getElementById('empty-state').style.display='none';
  // Hide all cards
  document.querySelectorAll('.recipe-card').forEach(c=>c.classList.remove('visible'));
  // Check if card exists
  let card = document.getElementById('card-'+id);
  if(!card){ card = buildCard(r); document.getElementById('cards-container').appendChild(card); }
  card.classList.add('visible');
  buildSidebar();
}

function buildCard(r){
  const div = document.createElement('div');
  div.className = 'recipe-card';
  div.id = 'card-'+r.id;
  const allergenHtml = r.allergens.length
    ? r.allergens.map(a=>`<span class="allergen">${a}</span>`).join('')
    : '<span class="allergen none">No major allergens</span>';
  const advanceHtml = r.advance.length
    ? r.advance.map(a=>`<div class="adv-item"><div class="adv-dot"></div>${a}</div>`).join('')
    : '<div style="font-size:11px;color:var(--stone)">No advance prep required</div>';
  const stepsHtml = r.steps.map((s,i)=>`
    <div class="method-step">
      <div class="step-num">${String(i+1).padStart(2,'0')}</div>
      <div class="step-body">
        <div class="step-title">${s.title}</div>
        <div class="step-text">${s.text}</div>
        ${s.crits.map(c=>`<span class="step-crit crit-${c.type}">
          ${c.type==='temp'?'🌡':c.type==='time'?'⏱':'⚠'} ${c.text}
        </span>`).join('')}
      </div>
    </div>`).join('');
  const ingsHtml = r.ingredients.map(ing=>`
    <div class="ingredient-row">
      <span class="ing-name">${ing.name}</span>
      <span class="ing-qty">${ing.qty}</span>
    </div>
    ${ing.note?`<div class="ingredient-row"><span class="ing-note">${ing.note}</span></div>`:''}`).join('');
  div.innerHTML = `
    <div class="rc-header">
      <div class="rc-meta-top">
        <span class="rc-day-badge">Cycle 01 · Day ${r.day} · ${WEEK_LABELS[r.week]}</span>
        <span class="rc-meal-badge badge-${r.meal}">${MEAL_LABELS[r.meal]}</span>
      </div>
      <div class="rc-title">${r.title}</div>
      <div class="rc-subtitle">${r.subtitle}</div>
    </div>
    <div class="rc-stats">
      <div class="rc-stat"><div class="rc-stat-val">${r.kcal}</div><div class="rc-stat-label">Kcal</div></div>
      <div class="rc-stat"><div class="rc-stat-val">${r.prot}g</div><div class="rc-stat-label">Protein</div></div>
      <div class="rc-stat"><div class="rc-stat-val">${r.carbs}g</div><div class="rc-stat-label">Carbs</div></div>
      <div class="rc-stat"><div class="rc-stat-val">${r.fat}g</div><div class="rc-stat-label">Fat</div></div>
      <div class="rc-stat"><div class="rc-stat-val">${r.ingredients.length}</div><div class="rc-stat-label">Ingredients</div></div>
      <div class="rc-stat"><div class="rc-stat-val">${r.steps.length}</div><div class="rc-stat-label">Steps</div></div>
    </div>
    <div class="rc-body">
      <div class="ingredients-panel">
        <div class="panel-title">Ingredients — 1 subscriber</div>
        ${ingsHtml}
      </div>
      <div class="method-panel">
        <div class="panel-title" style="font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);font-family:var(--ff-m);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)">Method — key steps</div>
        ${stepsHtml}
      </div>
    </div>
    <div class="rc-footer">
      <div class="footer-block">
        <div class="fb-title">Allergens</div>
        <div class="allergen-flags">${allergenHtml}</div>
      </div>
      <div class="footer-block">
        <div class="fb-title">Advance Prep Required</div>
        ${advanceHtml}
      </div>
      <div class="footer-block">
        <div class="fb-title">Plating Notes</div>
        <div class="plating-text">${r.plating}</div>
      </div>
    </div>`;
  return div;
}

// Navigation
function navigate(dir){
  const ids = RECIPES.map(r=>r.id);
  const cur = ids.indexOf(activeRecipeId);
  if(cur===-1){ showRecipe(ids[0]); return; }
  const next = cur+dir;
  if(next>=0 && next<ids.length) showRecipe(ids[next]);
}

function showRandom(){
  const r = RECIPES[Math.floor(Math.random()*RECIPES.length)];
  showRecipe(r.id);
}

// Init
buildSidebar();
showRecipe('d1bf');
</script>
